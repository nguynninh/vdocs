services:
  postgres:
    image: postgres:16-alpine
    container_name: vdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdocs_db}
      POSTGRES_USER: ${POSTGRES_USER:-vdocs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vdocs_user} -d ${POSTGRES_DB:-vdocs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: vdocs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  server:
    build: ./vdocs-server
    container_name: vdocs-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./vdocs-server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads_data:/app/uploads
    mem_limit: 512m

  client:
    build: ./vdocs-client
    container_name: vdocs-client
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - ./vdocs-client/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m

volumes:
  postgres_data:
  redis_data:
  uploads_data:
