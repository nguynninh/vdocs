services:
  postgres:
    image: postgres:16-alpine
    container_name: vdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vdocs_db
      POSTGRES_USER: vdocs_user
      POSTGRES_PASSWORD: vdocs123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdocs_user -d vdocs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vdocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
