services:
  postgres:
    image: postgres:16-alpine
    container_name: vdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vdocs_db
      POSTGRES_USER: vdocs_user
      POSTGRES_PASSWORD: vdocs123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdocs_user -d vdocs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vdocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vdocs-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: vdocs_minio
      MINIO_ROOT_PASSWORD: vdocs_minio_123456
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
